name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,rdf]'

      - name: Run tests
        run: pytest

  schema-consistency:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with schema deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[schema]'

      - name: Regenerate artifacts
        run: bash scripts/regenerate.sh

      - name: Generate docs and OWL (CI-only artifacts)
        run: |
          gen-doc src/pygrits/core.yaml -d docs
          gen-owl src/pygrits/core.yaml > src/pygrits/core.ttl

      - name: Assert no drift in committed generated files
        run: |
          if ! git diff --exit-code \
              src/pygrits/core.py \
              src/pygrits/core.schema.json \
              src/pygrits/core.context.jsonld \
              src/pygrits/viewpoints/; then
            echo "Generated artifacts are out of date with LinkML sources"
            echo "Run scripts/regenerate.sh and commit the result"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/ tests/
