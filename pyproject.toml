[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pygrits"
version = "0.6.0"
description = "Closed PROV-O + Web Annotation emit profile and validator for agentic claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Petrus H. Zwart" },
]
keywords = [
    "scientific-reasoning",
    "provenance",
    "prov-o",
    "web-annotation",
    "pygrits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.5",
    "jcs>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]
dev = [
    "pygrits[test]",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/phzwart/pygrits"
Repository = "https://github.com/phzwart/pygrits"
Issues = "https://github.com/phzwart/pygrits/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pygrits"]

[tool.hatch.build.targets.wheel.force-include]
"src/pygrits/context.jsonld" = "pygrits/context.jsonld"
"src/pygrits/schema.json" = "pygrits/schema.json"
"src/pygrits/PROFILE.md" = "pygrits/PROFILE.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
