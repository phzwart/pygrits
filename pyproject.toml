[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pygrits"
version = "0.5.0"
description = "Minimal evidence-grounded node model on PROV-O for agentic scientific reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Petrus H. Zwart" },
]
keywords = [
    "scientific-reasoning",
    "provenance",
    "linkml",
    "prov-o",
    "pygrits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.5",
    "jcs>=0.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
schema = [
    "linkml>=1.11",
]
rdf = [
    "rdflib>=7",
    "linkml>=1.11",
]
test = [
    "pytest>=7",
    "pytest-cov",
]
dev = [
    "pygrits[schema,rdf,test]",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/phzwart/pygrits"
Repository = "https://github.com/phzwart/pygrits"
Issues = "https://github.com/phzwart/pygrits/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pygrits"]

[tool.hatch.build.targets.wheel.force-include]
"src/pygrits/core.yaml" = "pygrits/core.yaml"
"src/pygrits/core.schema.json" = "pygrits/core.schema.json"
"src/pygrits/core.context.jsonld" = "pygrits/core.context.jsonld"
"src/pygrits/viewpoints/document_extraction_v0.yaml" = "pygrits/viewpoints/document_extraction_v0.yaml"
"src/pygrits/viewpoints/document_extraction_v0.schema.json" = "pygrits/viewpoints/document_extraction_v0.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/pygrits/core.py",
    "src/pygrits/viewpoints/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
