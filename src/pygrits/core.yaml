id: https://w3id.org/grits/core
name: pygrits_core
title: pygrits core
version: 0.5.0
license: BSD-3-Clause
description: >-
  Minimal evidence-grounded node model on PROV-O. Three roles: Entity,
  Activity, EvidenceRecord. Domain content is added by importing schemas that
  subclass Entity/Activity with typed slots. No domain vocabulary here.

prefixes:
  linkml: https://w3id.org/linkml/
  grits: https://w3id.org/grits/
  prov: http://www.w3.org/ns/prov#
  pplan: http://purl.org/net/p-plan#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: grits
default_range: string
imports:
  - linkml:types

types:
  Sha256Hex: {uri: xsd:string, base: str, pattern: "^[a-f0-9]{64}$"}
  CurieOrUri: {uri: xsd:anyURI, base: str}
  Iso8601:    {uri: xsd:dateTime, base: str}
  GritId:     {uri: xsd:string, base: str, pattern: "^[a-z]+:[A-Za-z0-9._:-]+$"}

enums:
  HashMode:
    permissible_values:
      raw_bytes:
      linkml_canonical_jcs:

  ActivityType:
    description: Role of an Activity edge. Four values, no more.
    permissible_values:
      derivation:
        description: Inputs -> new Entity. The workhorse. prov:Derivation.
        meaning: prov:Derivation
      support:
        description: Evidence -> Entity it supports. No output Entity.
      contradiction:
        description: Evidence -> Entity it contradicts. No output Entity.
      adjudication:
        description: Resolves a set of contradiction Activities. Output is a curator decision Entity.

  EvidenceLabel:
    description: How a claim relates to its evidence. One axis, four values.
    permissible_values:
      direct:
        description: Source states it. Locator points at the statement.
      derived:
        description: Follows by explicit reasoning from direct claims. Rationale required.
      inferred:
        description: Plausible reading with no stated rationale in any source.
      unknown:
        description: Slot is needed and no source fills it.

  ReviewState:
    permissible_values:
      machine_generated:
      curator_reviewed:
      disputed:
      retracted:

  ConfidenceBasis:
    permissible_values:
      self_report:
      conformal:
      bayesian:
      heuristic:

  NegativeResult:
    permissible_values:
      absent:
      weak_signal:
      excluded:
      inconclusive:

classes:

  ContentReference:
    description: Content-addressed reference. Identity is uri + sha256 + hash_mode.
    attributes:
      uri:        {required: true, slot_uri: schema:contentUrl}
      sha256:     {required: true, range: Sha256Hex}
      hash_mode:  {required: true, range: HashMode}
      media_type: {slot_uri: schema:encodingFormat}

  Scope:
    abstract: true
    description: Viewpoint-supplied conditions under which a node's statements apply. Subclass to add typed dimensions.
    attributes:
      scope_type: {required: true, designates_type: true}
      notes: {}

  NotesOnlyScope:
    is_a: Scope

  Locator:
    abstract: true
    attributes:
      locator_type: {required: true, designates_type: true}

  CharRangeLocator:
    is_a: Locator
    attributes:
      char_start: {required: true, range: integer}
      char_end:   {required: true, range: integer}
      page:       {range: integer}

  LineRangeLocator:
    is_a: Locator
    description: Line range in a text file (source code, notebook cell, log).
    attributes:
      path:       {required: true}
      line_start: {required: true, range: integer}
      line_end:   {required: true, range: integer}

  BboxLocator:
    is_a: Locator
    attributes:
      page:    {required: true, range: integer}
      bbox_x0: {required: true, range: float}
      bbox_y0: {required: true, range: float}
      bbox_x1: {required: true, range: float}
      bbox_y1: {required: true, range: float}

  TableCellLocator:
    is_a: Locator
    attributes:
      table_id: {required: true}
      row: {required: true, range: integer}
      col: {required: true, range: integer}

  SequencePositionLocator:
    is_a: Locator
    attributes:
      reference_sequence_id: {required: true}
      seq_start: {required: true, range: integer}
      seq_end:   {required: true, range: integer}

  FileRegionLocator:
    is_a: Locator
    attributes:
      byte_start: {required: true, range: integer}
      byte_end:   {required: true, range: integer}

  CompositeLocator:
    is_a: Locator
    attributes:
      members: {multivalued: true, range: Locator, inlined: true, inlined_as_list: true}

  Confidence:
    attributes:
      value:             {range: float}
      confidence_basis:  {required: true, range: ConfidenceBasis}
      calibration_scope: {}

  EvidenceLink:
    description: A labelled edge from an Entity to an EvidenceRecord. The label lives here, not on the record, because one record can support a claim directly and another only by inference.
    attributes:
      evidence_id: {required: true, range: GritId}
      label:       {required: true, range: EvidenceLabel}
      rationale:
        description: >-
          Required when label is derived or inferred. Enforce in a validator,
          not in the schema.

  Grit:
    abstract: true
    description: >-
      Base for all nodes. Immutable once written. id is declared; content_hash
      is an integrity check computed over all other fields and excluded from
      canonicalization.
    attributes:
      id:            {identifier: true, required: true, range: GritId}
      content_hash:  {range: Sha256Hex, description: Excluded from canonical bytes.}
      viewpoint_id:  {required: true, range: GritId, description: ViewpointDirective that shaped this node.}
      generated_by:
        range: GritId
        slot_uri: prov:wasGeneratedBy
        description: Activity that produced this node, if any.
      agent:
        slot_uri: prov:wasAttributedTo
        description: Software or person that produced this node (name+version, or ORCID).
      created_at:    {range: Iso8601, slot_uri: prov:generatedAtTime}
      review_state:  {range: ReviewState, ifabsent: string(machine_generated)}
      scope:         {range: Scope, inlined: true}
      caveats:       {multivalued: true, description: Optional free-text limits on use. Not a substitute for typed slots.}

  Entity:
    is_a: Grit
    class_uri: prov:Entity
    description: >-
      A subject node — a claim, a document, a measurement, a plan element.
      Domain schemas subclass this with typed slots. Formerly Object.
    attributes:
      plan_variable:
        range: CurieOrUri
        slot_uri: pplan:correspondsToVariable
        description: Type-level variable this entity instantiates, when a plan graph exists.
      derived_from:   {multivalued: true, range: GritId, slot_uri: prov:wasDerivedFrom}
      sources:        {multivalued: true, range: ContentReference, inlined: true, inlined_as_list: true, slot_uri: prov:hadPrimarySource}
      evidence:       {multivalued: true, range: EvidenceLink, inlined: true, inlined_as_list: true, description: Labelled links to EvidenceRecords.}
      summary:        {slot_uri: dcterms:description}

  Activity:
    is_a: Grit
    class_uri: prov:Activity
    description: Hyperedge. Consumes Entities/EvidenceRecords, may emit Entities.
    attributes:
      activity_type: {required: true, range: ActivityType}
      inputs:        {required: true, multivalued: true, range: GritId, slot_uri: prov:used}
      outputs:       {multivalued: true, range: GritId, slot_uri: prov:generated}
      plan_step:
        range: CurieOrUri
        slot_uri: pplan:correspondsToStep
        description: Type-level step this activity executes, when a plan graph exists.
      rationale:     {description: Why this activity is admissible given its inputs and viewpoint.}
      confidence:    {range: Confidence, inlined: true}
      started_at:    {range: Iso8601, slot_uri: prov:startedAtTime}
      ended_at:      {range: Iso8601, slot_uri: prov:endedAtTime}

  EvidenceRecord:
    is_a: Grit
    class_uri: prov:Entity
    description: Anchor into one source artifact via a typed locator.
    attributes:
      source:            {required: true, range: ContentReference, inlined: true, slot_uri: prov:hadPrimarySource}
      locator:           {required: true, range: Locator, inlined: true}
      extracted_content: {}
      evidence_type:     {range: CurieOrUri, description: Viewpoint-supplied CURIE for the kind of content.}
      extraction_confidence: {range: Confidence, inlined: true}

  NegativeEvidenceRecord:
    is_a: EvidenceRecord
    description: A search under stated scope that returned nothing. First-class absence.
    slot_usage:
      locator: {required: false}
    attributes:
      search_method: {required: true}
      search_scope:  {}
      result:        {required: true, range: NegativeResult}

  ViewpointDirective:
    is_a: Entity
    class_uri: prov:Plan
    description: Flat interpretive contract. No viewpoint inheritance.
    attributes:
      name:           {required: true, slot_uri: schema:name}
      prompts:        {multivalued: true, range: ContentReference, inlined: true, inlined_as_list: true}
      exemplars:      {multivalued: true, range: ContentReference, inlined: true, inlined_as_list: true}
      vocabularies:   {multivalued: true, range: ContentReference, inlined: true, inlined_as_list: true}
      target_schema:  {range: ContentReference, inlined: true}
      constraints:    {multivalued: true, description: Rules imposed on every node extracted under this viewpoint.}
